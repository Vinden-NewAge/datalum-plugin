name: Comprobar plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Estructura (manifiesto, Skill, hooks, contrato y CHANGELOG)
        run: python3 scripts/check.py

      - name: Pruebas documentales y de la actualización automática
        run: python3 -m unittest discover -s tests -t . -v

      - name: Pruebas de los controles del cliente
        run: node --test tests/client/*.test.js

      - name: Empaquetar la Skill
        run: python3 scripts/package.py
