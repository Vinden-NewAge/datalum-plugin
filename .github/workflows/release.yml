name: Publicar versión

# El camino manual: una persona fundió el PR de una versión y puso su etiqueta. Publica
# con las mismas comprobaciones que el camino automático (compat.yml): borrador,
# descarga y cotejo, publicación, segunda descarga y cotejo. Volver a correrlo sobre
# una etiqueta ya publicada no duplica ni cambia nada.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Comprobar que la etiqueta coincide con la versión
        run: python3 scripts/check.py --tag "$GITHUB_REF_NAME"

      - name: Pruebas
        run: |
          python3 -m unittest discover -s tests -t .
          node --test tests/client/*.test.js

      - name: Publicar en GitHub con el zip de la Skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/compat.py publicar --tag "$GITHUB_REF_NAME"
